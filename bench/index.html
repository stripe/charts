<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- An empty icon, so the browser does not request /favicon.ico. -->
    <link rel="icon" href="data:," />
    <title>StripeCharts benchmarks</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
      }
      #stage {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 16px;
      }
      .bench-shot {
        margin: 0;
      }
      .bench-shot figcaption {
        margin-bottom: 4px;
        font-size: 12px;
        color: #555;
      }
      #output {
        max-height: 50vh;
        overflow: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!--
      Benchmarks for the browser build. Build the package first (`dist/` is
      generated), serve the package directory over http and open
      bench/index.html. runner.js adds the build with a script tag, so its
      load time can be measured. See README.md.
    -->
    <p>
      <button id="quick" type="button">Run quick pass</button>
      <span id="status">Loading the build...</span>
    </p>
    <pre id="output"></pre>
    <div id="stage"></div>
    <script src="runner.js"></script>
    <script>
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      StripeChartsBench.ready.then(
        (load) => {
          status.textContent = `Loaded in ${load.scriptTagMs} ms.`;
        },
        (error) => {
          status.textContent = error.message;
        },
      );
      document.getElementById('quick').addEventListener('click', async () => {
        status.textContent = 'Running...';
        const results = await StripeChartsBench.quick();
        output.textContent = JSON.stringify(results, null, 2);
        status.textContent = 'Done.';
      });
    </script>
  </body>
</html>
