<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- An empty icon, so the browser does not request /favicon.ico. -->
    <link rel="icon" href="data:," />
    <title>マーケットプレイス運営状況（90日間）</title>
    <!--
      Example dashboard: daily operations of a marketplace in Japan over 90
      days, in Japanese (ja-JP), yen and Japan time, written the way an agent
      would write a single-file artifact. It also shows a loading placeholder
      turning into data, and an empty result.
      The data is made up and generated in the page by a seeded generator, so
      every load shows the same numbers.

      The script tag loads the local build from ../../dist/.
      Run npm run build:all before opening this file.
    -->
    <style>
      :root {
        --page: #f4f7fa;
        --surface: #ffffff;
        --border: #d5dbe1;
        --text: #1a2c44;
        --text-secondary: #3c4f69;
        --text-muted: #50617a;
        --positive: #217005;
        --negative: #c0123c;
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji',
          'Segoe UI Symbol';
        --gap: 16px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 20px;
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 40px 32px 56px;
      }
      .page-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px 24px;
        margin-bottom: 28px;
      }
      .eyebrow {
        margin: 0 0 4px;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 36px;
        font-weight: 700;
      }
      .lede {
        margin: 4px 0 0;
        color: var(--text-secondary);
      }
      .as-of {
        margin: 0;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 16px;
        font-variant-numeric: tabular-nums;
      }
      .section-label {
        margin: 32px 0 12px;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: var(--gap);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: var(--gap);
      }
      .span-4 {
        grid-column: span 4;
      }
      .span-6 {
        grid-column: span 6;
      }
      .span-12 {
        grid-column: span 12;
      }
      .span-8 {
        grid-column: span 8;
      }
      .panel {
        min-width: 0;
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .chart {
        height: 360px;
      }
      .panel-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: flex-end;
        gap: 8px 16px;
      }
      .refresh {
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text-secondary);
        font: inherit;
        font-size: 12px;
        line-height: 16px;
        cursor: pointer;
      }
      .refresh:hover {
        color: var(--text);
        border-color: #95a4ba;
      }
      .refresh:focus-visible {
        outline: 2px solid #9966ff;
        outline-offset: 2px;
      }
      .takeaways h2 {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }
      .takeaways ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .takeaways li {
        padding: 12px 0;
        border-top: 1px solid var(--border);
        color: var(--text-secondary);
      }
      .takeaways li:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .takeaways strong {
        color: var(--text);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .takeaways .up {
        color: var(--positive);
      }
      .takeaways .down {
        color: var(--negative);
      }
      .day-detail h3 {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 24px;
        font-weight: 600;
      }
      .day-detail dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
        margin: 0;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
      }
      .day-detail dd {
        margin: 0;
        color: var(--text);
        text-align: right;
      }
      .day-detail .total {
        font-weight: 600;
      }
      .day-detail .hint {
        margin: 12px 0 0;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 16px;
      }
      .footnote {
        margin: 32px 0 0;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 16px;
      }
      @media (max-width: 1100px) {
        .tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .span-8,
        .span-4 {
          grid-column: span 12;
        }
      }
      @media (min-width: 761px) and (max-width: 1100px) {
        .keep-columns .span-8 {
          grid-column: span 7;
        }
        .keep-columns .span-4 {
          grid-column: span 5;
        }
      }
      @media (max-width: 760px) {
        .chart.short {
          height: 240px;
        }
        main {
          padding: 24px 16px 40px;
        }
        h1 {
          font-size: 22px;
          line-height: 28px;
        }
        .span-6 {
          grid-column: span 12;
        }
        .panel {
          padding: 16px;
        }
        .chart {
          height: 320px;
        }
      }
      @media (max-width: 560px) {
        .tiles {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">こもれびマーケット · 運営レポート</p>
          <h1>マーケットプレイス運営状況</h1>
          <p class="lede">
            2026年8月16日〜11月13日の90日間。比較対象は曜日を揃えた直前の90日間です。
          </p>
        </div>
        <p class="as-of" id="as-of"></p>
      </header>

      <section aria-label="主要指標" class="tiles">
        <div id="tile-gmv"></div>
        <div id="tile-payouts"></div>
        <div id="tile-dispute-rate"></div>
        <div id="tile-sellers"></div>
      </section>

      <h2 class="section-label">入金</h2>
      <div class="grid">
        <section class="panel span-8">
          <div class="chart" id="payouts"></div>
          <div class="panel-footer">
            <button class="refresh" id="refresh" type="button">再読み込み</button>
          </div>
        </section>
        <section class="panel span-4 takeaways" aria-labelledby="takeaways-title">
          <h2 id="takeaways-title">要点</h2>
          <ul id="takeaways"></ul>
        </section>
      </div>

      <h2 class="section-label">リスク</h2>
      <div class="grid keep-columns">
        <section class="panel span-8"><div class="chart" id="dispute-rate"></div></section>
        <section class="panel span-4"><div class="chart short" id="high-value-disputes"></div></section>
      </div>

      <h2 class="section-label">決済手段</h2>
      <div class="grid keep-columns">
        <section class="panel span-8"><div class="chart" id="payment-methods"></div></section>
        <section class="panel span-4 day-detail" aria-live="polite">
          <h3 id="method-day"></h3>
          <dl id="method-rows"></dl>
          <p class="hint">グラフの日付をクリックすると、その日の内訳を表示します。凡例で非表示にした決済手段は内訳から除かれます。</p>
        </section>
      </div>

      <h2 class="section-label">海外購入</h2>
      <div class="grid">
        <section class="panel span-12"><div class="chart" id="countries"></div></section>
      </div>

      <p class="footnote">
        金額は円、日付は日本時間です。各カードの情報ボタンから、データの取得元・取得日時・値の一覧を確認できます。
      </p>
    </main>

    <script src="../../dist/stripe-charts.min.js"></script>
    <script>
      // ---- Data -------------------------------------------------------------
      // A seeded generator stands in for rows fetched from an API, so the page
      // is self-contained and reproducible.

      function seeded(seed) {
        return function next() {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const random = seeded(1111);
      const jitter = (amount) => 1 + (random() * 2 - 1) * amount;
      const yen = (value) => Math.round(value);
      const sum = (values) => values.reduce((total, v) => total + v, 0);
      const points = (xs, ys) => xs.map((x, i) => ({x, y: ys[i]}));

      function addDays(isoDate, days) {
        const date = new Date(isoDate + 'T00:00:00Z');
        date.setUTCDate(date.getUTCDate() + days);
        return date.toISOString().slice(0, 10);
      }
      const weekday = (isoDate) => new Date(isoDate + 'T00:00:00Z').getUTCDay();

      // 90 days to yesterday, and the 90 days before, shifted by 13 weeks so
      // weekdays line up.
      const DAYS = 90;
      const days = Array.from({length: DAYS}, (_, i) => addDays('2026-08-16', i));
      const previousDays = days.map((d) => addDays(d, -91));

      // Daily gross merchandise value: busier weekends, a lift on paydays (the
      // 25th) and on the November 11 shopping day, and steady growth.
      function dailyGmv(dates, base) {
        return dates.map((d, i) => {
          const weekend = [0, 6].includes(weekday(d)) ? 1.24 : 1;
          const payday = d.endsWith('-25') ? 1.12 : 1;
          const event = d.endsWith('-11-11') ? 1.65 : 1;
          return yen(base * (1 + 0.0028 * i) * weekend * payday * event * jitter(0.06));
        });
      }
      // Two extra days at the start, because sellers are paid out two days
      // after a sale, net of the 10% platform fee.
      const gmvWithLead = dailyGmv([addDays(days[0], -2), addDays(days[0], -1), ...days], 41800000);
      const previousGmvWithLead = dailyGmv([addDays(previousDays[0], -2), addDays(previousDays[0], -1), ...previousDays], 36500000);
      const gmv = gmvWithLead.slice(2);
      const previousGmv = previousGmvWithLead.slice(2);
      const payoutsFrom = (values) => values.slice(0, DAYS).map((v) => yen(v * 0.9));
      const payouts = payoutsFrom(gmvWithLead);
      const previousPayouts = payoutsFrom(previousGmvWithLead);

      // Disputes per successful payment. A card-testing wave in late
      // September (days 38 to 48) pushed the rate up until rules caught it.
      const wave = (i) => (i >= 38 && i <= 48 ? 1 + 1.3 * Math.sin(((i - 38) / 10) * Math.PI) : 1);
      const rate = (base, withWave) =>
        days.map((_, i) => Math.round(base * (withWave ? wave(i) : 1) * jitter(0.14) * 100000) / 100000);
      const disputeRate = rate(0.0021, true);
      const previousDisputeRate = rate(0.0024, false);

      const sellers = days.map((_, i) => Math.round(11840 + i * 7.4 + (random() - 0.5) * 40));
      const previousSellers = Math.round(11840 - 91 * 6.1);

      // Cross-border GMV by buyer country, for the last 13 complete weeks
      // (Monday starts).
      const weeks = Array.from({length: 13}, (_, i) => addDays('2026-08-10', i * 7));
      const country = (base, growth) => weeks.map((_, i) => yen(base * (1 + growth * i) * jitter(0.07)));
      const unitedStates = country(18200000, 0.012);
      const taiwan = country(14100000, 0.024);
      const korea = country(9300000, 0.018);
      const hongKong = country(7200000, 0.006);

      // GMV by payment method for the last 30 days; the share of convenience
      // store payments rises toward month end, and bank transfers stay small.
      const METHOD_DAYS = 30;
      const methodDays = days.slice(-METHOD_DAYS);
      const methodGmv = gmv.slice(-METHOD_DAYS);
      const methodShare = (i) => ({
        paypay: 0.27 * jitter(0.03),
        konbini: (0.11 + 0.1 * (new Date(methodDays[i] + 'T00:00:00Z').getUTCDate() / 31)) * jitter(0.04),
        bank: 0.04 * jitter(0.1),
      });
      const methodShares = methodDays.map((_, i) => methodShare(i));
      const paypay = methodGmv.map((v, i) => yen(v * methodShares[i].paypay));
      const konbini = methodGmv.map((v, i) => yen(v * methodShares[i].konbini));
      const bank = methodGmv.map((v, i) => yen(v * methodShares[i].bank));
      const cards = methodGmv.map((v, i) => v - paypay[i] - konbini[i] - bank[i]);

      const average = (values) => sum(values) / values.length;

      // ---- Charts -----------------------------------------------------------

      const LOCALE = 'ja-JP';
      const TIME_ZONE = 'Asia/Tokyo';
      // Yen has no minor unit, so API amounts are whole yen either way.
      const JPY = {style: 'currency', currency: 'jpy', unit: 'minor'};
      const FETCHED_AT = '2026-11-14T00:30:00Z';
      const PERIOD = '2026年8月16日〜11月13日';
      const VS_PREVIOUS = {label: '比較対象', value: '直前の90日間（曜日を揃えて比較）'};
      const vsPrevious = (current, previous) => [
        {label: '直近90日', data: points(days, current)},
        {label: '前の90日', comparison: true, data: points(previousDays, previous)},
      ];
      const render = (id, spec, options) =>
        StripeCharts.render(document.getElementById(id), {locale: LOCALE, timeZone: TIME_ZONE, ...spec}, options);


      render('tile-gmv', {
        version: 1,
        title: '流通総額',
        description: '90日間の合計',
        format: JPY,
        kpi: {basis: 'total', value: sum(gmv), comparisonValue: sum(previousGmv), notation: 'compact'},
        chart: {type: 'kpi'},
        series: vsPrevious(gmv, previousGmv),
      });

      render('tile-payouts', {
        version: 1,
        title: '出品者への入金額',
        description: '90日間の合計',
        format: JPY,
        kpi: {basis: 'total', value: sum(payouts), comparisonValue: sum(previousPayouts), notation: 'compact'},
        chart: {type: 'kpi'},
        series: vsPrevious(payouts, previousPayouts),
      });

      render('tile-dispute-rate', {
        version: 1,
        title: '不審請求申請率',
        description: '90日間の平均、決済件数あたり',
        format: {style: 'percent', unit: 'ratio', maximumFractionDigits: 2},
        // Fewer disputes is good, so a rise is shown in red.
        kpi: {
          basis: 'average',
          value: Math.round(average(disputeRate) * 100000) / 100000,
          comparisonValue: Math.round(average(previousDisputeRate) * 100000) / 100000,
          goodDirection: 'down',
        },
        chart: {type: 'kpi'},
        series: vsPrevious(disputeRate, previousDisputeRate),
      });

      render('tile-sellers', {
        version: 1,
        title: 'アクティブな出品者',
        description: '11月13日時点、90日前との比較',
        format: {style: 'number', maximumFractionDigits: 0},
        kpi: {basis: 'latest', value: sellers[DAYS - 1], comparisonValue: previousSellers},
        chart: {type: 'kpi'},
        series: [{label: 'アクティブな出品者', data: points(days, sellers)}],
      });

      // Loading, then data: the card shows a placeholder while the rows are
      // "fetched", then updates in place. The button repeats it as a refresh,
      // which keeps the chart and dims it until the new data arrives.
      const payoutsSpec = {
        version: 1,
        title: '出品者への入金額（日次）',
        description: '直前の90日間（曜日を揃えて比較）との比較',
        format: JPY,
        kpi: {basis: 'total', value: sum(payouts), comparisonValue: sum(previousPayouts)},
        chart: {type: 'line', legend: 'show'},
        series: vsPrevious(payouts, previousPayouts),
      };
      const payoutsChart = render('payouts', {
        version: 1,
        title: payoutsSpec.title,
        description: payoutsSpec.description,
        format: JPY,
        chart: {type: 'line'},
        loading: true,
      });
      const FETCH_DELAY_MS = 1200;
      setTimeout(() => payoutsChart.update({locale: LOCALE, timeZone: TIME_ZONE, ...payoutsSpec}), FETCH_DELAY_MS);
      document.getElementById('refresh').addEventListener('click', () => {
        payoutsChart.update({locale: LOCALE, timeZone: TIME_ZONE, ...payoutsSpec, loading: true});
        setTimeout(() => payoutsChart.update({locale: LOCALE, timeZone: TIME_ZONE, ...payoutsSpec}), FETCH_DELAY_MS);
      });

      render('dispute-rate', {
        version: 1,
        title: '不審請求申請率（日次）',
        description: '決済件数あたりの申請件数',
        format: {style: 'percent', unit: 'ratio', maximumFractionDigits: 2},
        chart: {type: 'line', legend: 'show'},
        series: vsPrevious(disputeRate, previousDisputeRate),
      });

      // An empty result is still a result: the card says so instead of
      // disappearing.
      render('high-value-disputes', {
        version: 1,
        title: '高額の不審請求申請（今週）',
        description: '10万円以上の申請',
        format: JPY,
        emptyMessage: '今週の申請はありません',
        chart: {type: 'bar'},
        series: [{label: '申請額', data: []}],
      });

      render('countries', {
        version: 1,
        title: '海外購入者の流通額（国・地域別、週次）',
        description: '直近13週間、月曜日始まり',
        format: JPY,
        chart: {type: 'bar'},
        series: [
          {label: 'アメリカ', data: points(weeks, unitedStates)},
          {label: '台湾', data: points(weeks, taiwan)},
          {label: '韓国', data: points(weeks, korea)},
          {label: '香港', data: points(weeks, hongKong)},
        ],
      });

      const METHODS = [
        {label: 'クレジットカード', values: cards},
        {label: 'PayPay', values: paypay},
        {label: 'コンビニ払い', values: konbini},
        {label: '銀行振込', values: bank},
      ];
      const hiddenMethods = new Set();
      let selectedDay = methodDays.length - 1;
      const yenFormat = new Intl.NumberFormat(LOCALE, {style: 'currency', currency: 'JPY'});
      const dayFormat = new Intl.DateTimeFormat(LOCALE, {month: 'long', day: 'numeric', weekday: 'short', timeZone: 'UTC'});
      const shareFormat = new Intl.NumberFormat(LOCALE, {style: 'percent', maximumFractionDigits: 1});

      // The side panel lists the selected day's methods, leaving out the ones
      // hidden in the chart's legend.
      function showMethodDay() {
        document.getElementById('method-day').textContent = dayFormat.format(new Date(methodDays[selectedDay] + 'T00:00:00Z'));
        const shown = METHODS.filter(({label}) => !hiddenMethods.has(label));
        const total = sum(shown.map(({values}) => values[selectedDay]));
        const rows = shown.flatMap(({label, values}) => {
          const term = document.createElement('dt');
          const value = document.createElement('dd');
          term.textContent = label;
          value.textContent = yenFormat.format(values[selectedDay]) + '（' + shareFormat.format(values[selectedDay] / total) + '）';
          return [term, value];
        });
        const totalTerm = document.createElement('dt');
        const totalValue = document.createElement('dd');
        totalTerm.className = totalValue.className = 'total';
        totalTerm.textContent = '合計';
        totalValue.textContent = yenFormat.format(total);
        document.getElementById('method-rows').replaceChildren(...rows, totalTerm, totalValue);
      }

      render(
        'payment-methods',
        {
          version: 1,
          title: '決済手段別の流通額（日次）',
          description: '直近30日間。凡例をクリックして決済手段を絞り込めます',
          format: JPY,
          chart: {type: 'bar', stacking: 'stacked', legend: 'show'},
          series: METHODS.map(({label, values}) => ({label, data: points(methodDays, values)})),
        },
        {
          onPointClick: (event) => {
            selectedDay = event.index;
            showMethodDay();
          },
          onLegendChange: ({hidden}) => {
            hiddenMethods.clear();
            hidden.forEach((label) => hiddenMethods.add(label));
            showMethodDay();
          },
        },
      );
      showMethodDay();


      // ---- Takeaways ----------------------------------------------------------
      // Written from the numbers above, the way an agent would summarize them.
      // Built with text nodes: every string is treated as text.

      const money = new Intl.NumberFormat(LOCALE, {style: 'currency', currency: 'JPY', notation: 'compact', maximumFractionDigits: 1});
      const percent = (v, digits = 1) =>
        new Intl.NumberFormat(LOCALE, {style: 'percent', maximumFractionDigits: digits, minimumFractionDigits: digits}).format(v);
      const change = (now, then) => (now >= then ? '+' : '') + percent((now - then) / Math.abs(then));
      const dayName = (iso) => new Intl.DateTimeFormat(LOCALE, {month: 'long', day: 'numeric', timeZone: 'UTC'}).format(new Date(iso + 'T00:00:00Z'));

      const peakRate = Math.max(...disputeRate);
      const peakDay = days[disputeRate.indexOf(peakRate)];
      const recentRate = average(disputeRate.slice(-14));
      const growth = (values) => values[values.length - 1] / values[0] - 1;
      const eventDay = days.indexOf('2026-11-11');

      const takeaways = [
        ['90日間の入金額は', {strong: money.format(sum(payouts))}, 'で、前の90日間比', {change: change(sum(payouts), sum(previousPayouts))}, 'でした。'],
        ['11月11日の流通額は', {strong: money.format(gmv[eventDay])}, 'で期間中の最高でした。入金は2日後の13日に反映されています。'],
        ['不審請求申請率は', dayName(peakDay), 'に', {strong: percent(peakRate, 2)}, 'まで上がりましたが、直近2週間の平均は', {strong: percent(recentRate, 2)}, 'に戻っています。'],
        ['海外購入では台湾が13週間で', {change: change(taiwan[12], taiwan[0])}, 'と最も伸びています。'],
      ];

      const list = document.getElementById('takeaways');
      for (const parts of takeaways) {
        const item = document.createElement('li');
        for (const part of parts) {
          if (typeof part === 'string') {
            item.append(part);
          } else {
            const emphasis = document.createElement('strong');
            if (part.change !== undefined) emphasis.className = part.change.startsWith('+') ? 'up' : 'down';
            emphasis.textContent = part.strong ?? part.change;
            item.append(emphasis);
          }
        }
        list.append(item);
      }

      document.getElementById('as-of').textContent =
        new Intl.DateTimeFormat(LOCALE, {year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: TIME_ZONE, timeZoneName: 'short'}).format(
          new Date(FETCHED_AT),
        ) + '時点のデータ';
    </script>
  </body>
</html>
