<!DOCTYPE html>
<html lang="en">
  <head>

    <!-- An empty icon, so the browser does not request /favicon.ico. -->
    <link rel="icon" href="data:," />

  </head>
  <body>
    <!--
      A complete page using the self-contained browser build: one script
      tag, one element, one JSON spec. Build first (`dist/` is generated),
      then open this file directly or serve the package directory.
    -->
    <div id="chart"></div>
    <script src="../dist/stripe-charts.min.js"></script>
    <script>
      const spec = {

        timeZone: 'America/New_York',
        kpi: {basis: 'total', value: 179431180, comparisonValue: 156955125},
        chart: {type: 'line'},
        series: [
          {
            label: '2026',
            data: [
              {x: '2026-11-26', y: 28641025},
              {x: '2026-11-27', y: 41200025},
              {x: '2026-11-28', y: 33895080},
              {x: '2026-11-29', y: 30122040},
              {x: '2026-11-30', y: 45573010},
            ],
          },
          {
            label: '2025',
            comparison: true,
            data: [
              {x: '2025-11-27', y: 25180000},

            {label: 'Metric', value: 'gross_volume'},
            {label: 'Period', value: 'Nov 26 to Nov 30, 2026'},

            {label: 'Time zone', value: 'America/New_York'},
          ],
        },
      };

      StripeCharts.render(document.getElementById('chart'), spec);

  </body>
</html>
